name: release
on:
  push:
    branches: [main]
    paths: [RELEASE_VERSION]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: find src tests examples -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < RELEASE_VERSION)"
          test -n "$VERSION" || { echo 'RELEASE_VERSION is empty'; exit 1; }
          TAG="$VERSION"
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          cat > RELEASE_NOTES.md <<'EOF'
          Vendo Gateway firmware management update.

          Highlights:
          - public firmware release-manifest discovery belongs to Vendo Gateway, not PixiePoint
          - current-versus-latest device firmware status
          - firmware.check and firmware.update command helpers
          - 1 to 24 hour OTA policy validation with a 2 hour default
          - device sync no longer pushes firmware binaries or release metadata automatically
          - ESP firmware remains responsible for autonomous discovery, verification and installation
          EOF
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Vendo Gateway $TAG" --notes-file RELEASE_NOTES.md
