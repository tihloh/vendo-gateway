name: Release Vendo Gateway

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version tag to release, e.g. v1.2.3'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ inputs.release_tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${INPUT_TAG}"
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release tag ${TAG} already exists; refusing to move an immutable release tag."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate Composer package
        run: composer validate --strict

      - name: PHP syntax check
        run: find src tests examples -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: composer test

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Vendo Gateway $TAG" \
            --generate-notes
